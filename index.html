
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus Projetos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #06101c, #102b43);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 15px;
            text-align: center;
        }

        .descricao {
            color: #b8c9d9;
            margin-bottom: 40px;
            text-align: center;
            font-size: 17px;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .btn {
            display: inline-block;
            padding: 18px 30px;
            min-width: 220px;
            text-align: center;
            color: #06101c;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 14px;
            transition: 0.3s ease;
            box-shadow: 0 8px 25px rgba(54, 217, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 12px 30px rgba(54, 217, 255, 0.4);
        }

        .btn-ia {
            background: linear-gradient(135deg, #a855f7, #36d9ff);
        }

        .btn-transito {
            background: linear-gradient(135deg, #36d9ff, #54e39a);
        }

        .btn-enem {
            background: linear-gradient(135deg, #07539b, #07977e);
            color: white;
        }

        footer {
            color: #94a3b8;
            margin-top: 60px;
            text-align: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 29px;
            }

            .botoes {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <h1>🚀 Meus Projetos</h1>

    <p class="descricao">
        Escolha um dos sites abaixo para acessar:
    </p>

    <div class="botoes">

        <a href="./iacapaz.html" class="btn btn-ia">
            🤖 IA & FAKE NEWS x
        </a>

        <a href="./transito.html" class="btn btn-transito">
            🚦 SITE DE TRÂNSITO x
        </a>

        <a href="./enem.html" class="btn btn-enem">
            🎓 IMPORTÂNCIA DO ENEM x
        </a>

    </div>

    <footer>
        <p>Todos os direitos reservados © 2026</p>
    </footer>

</body>
</html>
